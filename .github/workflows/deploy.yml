name: Deploy worker
on:
  push:
    branches: [main]
    paths: ['server/worker.js', 'wrangler.toml', '.github/workflows/deploy.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the server's own tests
        working-directory: server
        run: npm install --no-audit --no-fund && node test.mjs > /dev/null
      - name: Deploy to Cloudflare
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: No key yet
        if: ${{ env.CF_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN is not set, nothing deployed"
